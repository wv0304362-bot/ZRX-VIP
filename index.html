<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Command Center - Vaeltrix Light</title>
    <!-- Tailwind CSS for modern responsive utility styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome for crisp UI icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap');
        body {
            font-family: 'Space Grotesk', sans-serif;
            background-color: #f3f4f8;
            color: #1e293b;
        }
        /* Custom smooth transitions for cards and toggles */
        .glass-card {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(226, 232, 240, 0.8);
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.04), 0 8px 10px -6px rgba(0, 0, 0, 0.02);
        }
        /* Toggle Switch Animation */
        .toggle-checkbox:checked {
            right: 0;
            border-color: #4f46e5;
        }
        .toggle-checkbox:checked + .toggle-label {
            background-color: #4f46e5;
        }
    </style>
</head>
<body class="flex justify-center items-center min-h-screen p-0 sm:p-4">

    <div class="w-full max-w-md bg-[#f7f8fc] sm:rounded-[3rem] sm:shadow-2xl overflow-hidden flex flex-col h-screen sm:h-[880px] relative border border-slate-200">
        
        <!-- Top Header Bar -->
        <header class="flex items-center justify-between px-6 py-5 bg-transparent z-10">
            <button id="backBtn" class="w-10 h-10 rounded-full bg-white border border-slate-200 flex items-center justify-center text-slate-600 hover:bg-slate-50 transition shadow-sm active:scale-95">
                <i class="fa-solid fa-chevron-left text-sm"></i>
            </button>
            <div class="text-center">
                <div class="flex items-center justify-center gap-1.5">
                    <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
                    <h1 class="text-xs font-bold tracking-[0.2em] text-slate-400 uppercase">Vaeltrix Light</h1>
                </div>
                <p class="text-[10px] font-semibold text-slate-500 tracking-wider">COMMAND CENTER</p>
            </div>
            <button id="refreshBtn" class="w-10 h-10 rounded-full bg-white border border-slate-200 flex items-center justify-center text-slate-600 hover:bg-slate-50 transition shadow-sm active:scale-95">
                <i class="fa-solid fa-rotate-right text-sm"></i>
            </button>
        </header>

        <!-- Main Scrollable Content Area -->
        <main id="mainContent" class="flex-1 overflow-y-auto px-5 pb-28 pt-2 space-y-6">
            
            <section class="glass-card rounded-[2rem] p-5 relative overflow-hidden">
                <div class="flex justify-between items-start mb-4">
                    <div class="inline-flex items-center gap-2 bg-emerald-50 border border-emerald-200/60 px-3 py-1 rounded-full">
                        <span class="w-2 h-2 rounded-full bg-emerald-500"></span>
                        <span class="text-[11px] font-bold text-emerald-700 tracking-wider">ONLINE</span>
                    </div>
                    <span class="text-xs font-mono text-slate-400">ID 973a002608</span>
                </div>

                <!-- Device Hero Info -->
                <div class="flex items-center gap-4 mb-5">
                    <div class="w-14 h-14 rounded-2xl bg-slate-900 text-white flex items-center justify-center shadow-lg shadow-slate-900/10">
                        <i class="fa-solid fa-mobile-screen text-2xl"></i>
                    </div>
                    <div>
                        <h2 class="text-sm font-bold text-slate-800 tracking-tight">TARGET DEVICE</h2>
                        <p class="text-xs font-mono text-slate-400 truncate max-w-[180px]">Android_Test_Unit_01</p>
                    </div>
                </div>

                <!-- Device Metrics Sub-Cards -->
                <div class="grid grid-cols-3 gap-2.5">
                    <div class="bg-white/80 border border-slate-100 rounded-2xl p-2.5 text-center shadow-xs">
                        <div class="text-[10px] text-slate-400 uppercase tracking-wider mb-0.5"><i class="fa-brands fa-android mr-1"></i>Android</div>
                        <div id="metricAndroid" class="text-xs font-bold text-slate-700">14.0</div>
                    </div>
                    <div class="bg-white/80 border border-slate-100 rounded-2xl p-2.5 text-center shadow-xs">
                        <div class="text-[10px] text-slate-400 uppercase tracking-wider mb-0.5"><i class="fa-solid fa-battery-three-quarters mr-1"></i>Battery</div>
                        <div id="metricBattery" class="text-xs font-bold text-emerald-600">86%</div>
                    </div>
                    <div class="bg-white/80 border border-slate-100 rounded-2xl p-2.5 text-center shadow-xs">
                        <div class="text-[10px] text-slate-400 uppercase tracking-wider mb-0.5"><i class="fa-solid fa-wifi mr-1"></i>IP</div>
                        <div id="metricIp" class="text-xs font-bold text-slate-700 font-mono">192.168.1.15</div>
                    </div>
                </div>
            </section>

            <section>
                <div class="flex items-center justify-between mb-3 px-1">
                    <h3 class="text-xs font-bold tracking-[0.15em] text-slate-400 uppercase">Device Control</h3>
                    <span class="text-[10px] font-semibold text-slate-400 tracking-wider">SYSTEM COMMANDS</span>
                </div>

                <!-- Control Cards Grid -->
                <div class="grid grid-cols-2 gap-3.5">
                    
                    <!-- Flash Control Card -->
                    <div class="glass-card rounded-[1.75rem] p-4 flex flex-col justify-between transition-all duration-300 hover:shadow-md">
                        <div class="flex justify-between items-start mb-6">
                            <div class="w-10 h-10 rounded-xl bg-amber-100 text-amber-600 flex items-center justify-center text-lg">
                                <i class="fa-solid fa-bolt"></i>
                            </div>
                            <!-- Toggle switch -->
                            <label class="relative inline-flex items-center cursor-pointer">
                                <input type="checkbox" data-command="Flash" class="sr-only peer toggle-input">
                                <div class="w-11 h-6 bg-slate-200 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-slate-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-indigo-600"></div>
                            </label>
                        </div>
                        <div>
                            <h4 class="text-sm font-bold text-slate-800 tracking-tight mb-0.5">Flash</h4>
                            <p class="status-text text-[11px] font-medium text-slate-400 flex items-center gap-1.5">
                                <span class="w-1.5 h-1.5 rounded-full bg-slate-300 status-dot"></span> <span class="status-label">STANDBY</span>
                            </p>
                        </div>
                    </div>

                    <!-- Lock Device Control Card -->
                    <div class="glass-card rounded-[1.75rem] p-4 flex flex-col justify-between transition-all duration-300 hover:shadow-md">
                        <div class="flex justify-between items-start mb-6">
                            <div class="w-10 h-10 rounded-xl bg-purple-100 text-purple-600 flex items-center justify-center text-lg">
                                <i class="fa-solid fa-lock"></i>
                            </div>
                            <label class="relative inline-flex items-center cursor-pointer">
                                <input type="checkbox" data-command="Lock Device" class="sr-only peer toggle-input">
                                <div class="w-11 h-6 bg-slate-200 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-slate-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-indigo-600"></div>
                            </label>
                        </div>
                        <div>
                            <h4 class="text-sm font-bold text-slate-800 tracking-tight mb-0.5">Lock Device</h4>
                            <p class="status-text text-[11px] font-medium text-slate-400 flex items-center gap-1.5">
                                <span class="w-1.5 h-1.5 rounded-full bg-slate-300 status-dot"></span> <span class="status-label">STANDBY</span>
                            </p>
                        </div>
                    </div>

                    <!-- Custom Lock Control Card -->
                    <div class="glass-card rounded-[1.75rem] p-4 flex flex-col justify-between transition-all duration-300 hover:shadow-md">
                        <div class="flex justify-between items-start mb-6">
                            <div class="w-10 h-10 rounded-xl bg-indigo-100 text-indigo-600 flex items-center justify-center text-lg">
                                <i class="fa-solid fa-shield-halved"></i>
                            </div>
                            <label class="relative inline-flex items-center cursor-pointer">
                                <input type="checkbox" data-command="Custom Lock" class="sr-only peer toggle-input">
                                <div class="w-11 h-6 bg-slate-200 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-slate-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-indigo-600"></div>
                            </label>
                        </div>
                        <div>
                            <h4 class="text-sm font-bold text-slate-800 tracking-tight mb-0.5">Custom Lock</h4>
                            <p class="status-text text-[11px] font-medium text-slate-400 flex items-center gap-1.5">
                                <span class="w-1.5 h-1.5 rounded-full bg-slate-300 status-dot"></span> <span class="status-label">STANDBY</span>
                            </p>
                        </div>
                    </div>

                    <!-- Video Overlay Control Card -->
                    <div class="glass-card rounded-[1.75rem] p-4 flex flex-col justify-between transition-all duration-300 hover:shadow-md">
                        <div class="flex justify-between items-start mb-6">
                            <div class="w-10 h-10 rounded-xl bg-rose-100 text-rose-600 flex items-center justify-center text-lg">
                                <i class="fa-solid fa-clapperboard"></i>
                            </div>
                            <label class="relative inline-flex items-center cursor-pointer">
                                <input type="checkbox" data-command="Video Overlay" class="sr-only peer toggle-input">
                                <div class="w-11 h-6 bg-slate-200 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-slate-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-indigo-600"></div>
                            </label>
                        </div>
                        <div>
                            <h4 class="text-sm font-bold text-slate-800 tracking-tight mb-0.5">Video Overlay</h4>
                            <p class="status-text text-[11px] font-medium text-slate-400 flex items-center gap-1.5">
                                <span class="w-1.5 h-1.5 rounded-full bg-slate-300 status-dot"></span> <span class="status-label">STANDBY</span>
                            </p>
                        </div>
                    </div>

                    <!-- Audio Mute Control Card -->
                    <div class="glass-card rounded-[1.75rem] p-4 flex flex-col justify-between transition-all duration-300 hover:shadow-md">
                        <div class="flex justify-between items-start mb-6">
                            <div class="w-10 h-10 rounded-xl bg-orange-100 text-orange-600 flex items-center justify-center text-lg">
                                <i class="fa-solid fa-volume-xmark"></i>
                            </div>
                            <label class="relative inline-flex items-center cursor-pointer">
                                <input type="checkbox" data-command="Mute Stream" class="sr-only peer toggle-input">
                                <div class="w-11 h-6 bg-slate-200 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-slate-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-indigo-600"></div>
                            </label>
                        </div>
                        <div>
                            <h4 class="text-sm font-bold text-slate-800 tracking-tight mb-0.5">Mute Stream</h4>
                            <p class="status-text text-[11px] font-medium text-slate-400 flex items-center gap-1.5">
                                <span class="w-1.5 h-1.5 rounded-full bg-slate-300 status-dot"></span> <span class="status-label">STANDBY</span>
                            </p>
                        </div>
                    </div>

                    <!-- Eye / Stealth Control Card -->
                    <div class="glass-card rounded-[1.75rem] p-4 flex flex-col justify-between transition-all duration-300 hover:shadow-md">
                        <div class="flex justify-between items-start mb-6">
                            <div class="w-10 h-10 rounded-xl bg-sky-100 text-sky-600 flex items-center justify-center text-lg">
                                <i class="fa-solid fa-eye-slash"></i>
                            </div>
                            <label class="relative inline-flex items-center cursor-pointer">
                                <input type="checkbox" data-command="Stealth Mode" class="sr-only peer toggle-input">
                                <div class="w-11 h-6 bg-slate-200 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-slate-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-indigo-600"></div>
                            </label>
                        </div>
                        <div>
                            <h4 class="text-sm font-bold text-slate-800 tracking-tight mb-0.5">Stealth Mode</h4>
                            <p class="status-text text-[11px] font-medium text-slate-400 flex items-center gap-1.5">
                                <span class="w-1.5 h-1.5 rounded-full bg-slate-300 status-dot"></span> <span class="status-label">STANDBY</span>
                            </p>
                        </div>
                    </div>

                </div>
            </section>
        </main>

        <nav class="absolute bottom-4 left-4 right-4 bg-white/90 backdrop-blur-md border border-slate-200/80 rounded-full py-2.5 px-6 shadow-xl flex items-center justify-around z-20">
            <!-- Home Tab -->
            <button onclick="switchTab('home')" id="tabHome" class="nav-tab flex flex-col items-center justify-center text-slate-400 hover:text-slate-600 transition p-2">
                <i class="fa-solid fa-house text-lg"></i>
            </button>
            
            <!-- Control Tab (Active) -->
            <button onclick="switchTab('control')" id="tabControl" class="nav-tab flex items-center gap-2 bg-[#121826] text-white px-5 py-2.5 rounded-full shadow-md transition transform active:scale-95">
                <i class="fa-solid fa-sliders text-sm"></i>
                <span class="text-xs font-bold tracking-wider">Control</span>
            </button>

            <!-- Chat / Logs Tab -->
            <button onclick="switchTab('chat')" id="tabChat" class="nav-tab flex flex-col items-center justify-center text-slate-400 hover:text-slate-600 transition p-2">
                <i class="fa-solid fa-comments text-lg"></i>
            </button>
        </nav>

    </div>

    <script>
        // Toggle switch behavior updates card status label dynamically
        document.querySelectorAll('.toggle-input').forEach(input => {
            input.addEventListener('change', function() {
                const card = this.closest('.glass-card');
                const statusDot = card.querySelector('.status-dot');
                const statusLabel = card.querySelector('.status-label');
                const commandName = this.getAttribute('data-command');

                if (this.checked) {
                    statusDot.className = 'w-1.5 h-1.5 rounded-full bg-emerald-500 animate-pulse status-dot';
                    statusLabel.textContent = 'ACTIVE';
                    statusLabel.className = 'status-label text-emerald-600 font-bold';
                    showNotification(`Command '${commandName}' Sent Successfully`);
                } else {
                    statusDot.className = 'w-1.5 h-1.5 rounded-full bg-slate-300 status-dot';
                    statusLabel.textContent = 'STANDBY';
                    statusLabel.className = 'status-label text-slate-400';
                    showNotification(`Command '${commandName}' Disabled`);
                }
            });
        });

        // Tab Switching Handler
        function switchTab(tabName) {
            const mainContent = document.getElementById('mainContent');
            
            if (tabName === 'home') {
                mainContent.innerHTML = `
                    <div class="flex flex-col items-center justify-center py-16 text-center space-y-4">
                        <div class="w-16 h-16 rounded-3xl bg-indigo-50 text-indigo-600 flex items-center justify-center text-2xl shadow-inner">
                            <i class="fa-solid fa-house-chimney"></i>
                        </div>
                        <h2 class="text-base font-bold text-slate-800">Home Dashboard</h2>
                        <p class="text-xs text-slate-400 max-w-xs">Overview of registered target devices, active laboratory nodes, and system health metrics.</p>
                        <div class="glass-card w-full rounded-2xl p-4 text-left mt-4">
                            <div class="text-xs font-bold text-slate-600 mb-1">Active Laboratory Node</div>
                            <div class="text-[11px] text-slate-400 font-mono">localhost:8080 / secure-ws</div>
                        </div>
                    </div>
                `;
            } else if (tabName === 'control') {
                // Reload control panel view
                location.reload();
            } else if (tabName === 'chat') {
                mainContent.innerHTML = `
                    <div class="flex flex-col h-[600px] justify-between">
                        <div class="flex items-center justify-between border-b border-slate-200 pb-3 mb-3">
                            <h3 class="text-xs font-bold tracking-[0.15em] text-slate-400 uppercase">Secure Test Logs</h3>
                            <span class="text-[10px] bg-emerald-50 text-emerald-600 font-bold px-2 py-0.5 rounded-full">Live Feed</span>
                        </div>
                        <div class="flex-1 overflow-y-auto space-y-3 pr-1 text-xs">
                            <div class="bg-white/80 p-3 rounded-2xl border border-slate-100 shadow-xs">
                                <div class="text-[10px] text-slate-400 mb-1 font-mono">16:10:05 - System</div>
                                <div class="text-slate-700 font-medium">Session initialized securely via WebSocket.</div>
                            </div>
                            <div class="bg-white/80 p-3 rounded-2xl border border-slate-100 shadow-xs">
                                <div class="text-[10px] text-slate-400 mb-1 font-mono">16:10:12 - Target</div>
                                <div class="text-slate-700 font-medium">Device heartbeat acknowledged. Battery at 86%.</div>
                            </div>
                        </div>
                        <div class="pt-3">
                            <div class="flex gap-2">
                                <input type="text" placeholder="Send test command..." class="flex-1 bg-white border border-slate-200 rounded-xl px-4 py-2.5 text-xs focus:outline-none focus:border-indigo-500">
                                <button class="bg-[#121826] text-white px-4 py-2.5 rounded-xl text-xs font-bold shadow-md hover:bg-slate-800 transition">Send</button>
                            </div>
                        </div>
                    </div>
                `;
            }
        }

        // Custom notification toast instead of alert()
        function showNotification(message) {
            const existingToast = document.getElementById('toastNotification');
            if (existingToast) existingToast.remove();

            const toast = document.createElement('div');
            toast.id = 'toastNotification';
            toast.className = 'fixed top-5 left-1/2 transform -translate-x-1/2 bg-[#121826] text-white text-xs font-medium px-4 py-2.5 rounded-full shadow-2xl z-50 transition-all duration-300 flex items-center gap-2 border border-slate-700';
            toast.innerHTML = `<i class="fa-solid fa-circle-check text-emerald-400"></i> <span>${message}</span>`;
            document.body.appendChild(toast);

            setTimeout(() => {
                toast.style.opacity = '0';
                setTimeout(() => toast.remove(), 300);
            }, 2500);
        }

        // Refresh Button Action
        document.getElementById('refreshBtn').addEventListener('click', () => {
            showNotification('Refreshing device metrics...');
            setTimeout(() => {
                document.getElementById('metricBattery').textContent = '87%';
                showNotification('Device metrics updated successfully.');
            }, 1000);
        });

        document.getElementById('backBtn').addEventListener('click', () => {
            showNotification('Already at root view.');
        });
    </script>
</body>
</html>
