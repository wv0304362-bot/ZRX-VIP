<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Painel Cyber</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        html, body {
            width: 100%;
            height: 100%;
            background-color: #090d16;
            color: #f8fafc;
            overflow: hidden;
        }

        .app-container {
            width: 100%;
            height: 100vh;
            background: #0f172a;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        .view-section {
            flex: 1;
            width: 100%;
            overflow-y: auto;
            display: none;
            padding-bottom: 80px; /* Espaço para a dock bar */
        }

        .view-section.active {
            display: flex;
            flex-direction: column;
        }

        /* --- BARRA DE NAVEGAÇÃO INFERIOR --- */
        .cyber-dock {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 75px;
            background: rgba(15, 23, 42, 0.95);
            backdrop-filter: blur(16px);
            border-top: 1px solid rgba(56, 189, 248, 0.2);
            display: flex;
            align-items: center;
            justify-content: space-around;
            z-index: 1000;
            padding: 0 20px;
        }

        .dock-item {
            background: none;
            border: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: #64748b;
            transition: all 0.2s ease;
            gap: 4px;
        }

        .dock-item svg {
            width: 24px;
            height: 24px;
            fill: #64748b;
            transition: fill 0.2s;
        }

        .dock-item span {
            font-size: 0.65rem;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        .dock-item.active {
            color: #38bdf8;
        }

        .dock-item.active svg {
            fill: #38bdf8;
        }

        /* Botão Central Brilhante (Casinha) */
        .dock-center-btn {
            position: relative;
            top: -15px;
            width: 58px;
            height: 58px;
            background: linear-gradient(135deg, #0284c7, #38bdf8);
            border-radius: 50%;
            border: 3px solid #0f172a;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 0 20px rgba(56, 189, 248, 0.6), inset 0 0 10px rgba(255, 255, 255, 0.4);
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .dock-center-btn svg {
            width: 26px;
            height: 26px;
            fill: #ffffff;
        }

        .dock-center-btn:active {
            transform: scale(0.92);
        }

        /* --- ESTILOS DO PAINEL / HOME --- */
        .banner-container {
            width: 100%;
            height: 210px;
            background: #1e293b;
            position: relative;
            overflow: hidden;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        .banner-container img, 
        .banner-container video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            position: absolute;
            inset: 0;
            z-index: 1;
        }

        .banner-overlay {
            position: absolute;
            inset: 0;
            background: linear-gradient(to bottom, rgba(15, 23, 42, 0.2), rgba(15, 23, 42, 0.95));
            pointer-events: none;
            z-index: 2;
        }

        .banner-upload-btn {
            position: relative;
            z-index: 3;
            background: rgba(15, 23, 42, 0.7);
            border: 2px dashed #38bdf8;
            border-radius: 50%;
            width: 64px;
            height: 64px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            backdrop-filter: blur(4px);
        }

        .banner-upload-btn.hidden { display: none; }
        .banner-upload-btn svg { width: 32px; height: 32px; fill: #38bdf8; }

        .content-body {
            padding: 16px;
            margin-top: -35px;
            position: relative;
            z-index: 4;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .profile-card {
            background: rgba(30, 41, 59, 0.85);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(56, 189, 248, 0.3);
            border-radius: 16px;
            padding: 16px;
            display: flex;
            align-items: center;
            gap: 14px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4);
        }

        .profile-avatar-container {
            position: relative;
            width: 65px;
            height: 65px;
            flex-shrink: 0;
        }

        .profile-avatar {
            width: 100%;
            height: 100%;
            border-radius: 14px;
            background: #1e293b;
            overflow: hidden;
            border: 2px solid #38bdf8;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .profile-avatar img { width: 100%; height: 100%; object-fit: cover; }
        .profile-avatar svg { width: 28px; height: 28px; fill: #64748b; }

        .avatar-upload-overlay {
            position: absolute;
            bottom: -4px;
            right: -4px;
            background: #0284c7;
            border: 2px solid #0f172a;
            border-radius: 50%;
            width: 24px;
            height: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }
        .avatar-upload-overlay svg { width: 14px; height: 14px; fill: #ffffff; }

        .profile-info { flex-grow: 1; }
        .name-wrapper { display: flex; align-items: center; gap: 8px; margin-bottom: 2px; }
        .profile-info h2 { font-size: 1.05rem; color: #f8fafc; }
        .edit-icon { width: 14px; height: 14px; fill: #94a3b8; cursor: pointer; }
        
        .profile-tag-id {
            font-size: 0.8rem;
            color: #38bdf8;
            font-weight: 600;
            margin-bottom: 4px;
            display: block;
        }

        .profile-badge {
            display: inline-block;
            font-size: 0.7rem;
            background: rgba(2, 132, 199, 0.25);
            color: #38bdf8;
            padding: 3px 8px;
            border-radius: 6px;
            border: 1px solid rgba(2, 132, 199, 0.4);
            font-weight: 600;
        }

        .grid-2x2 {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }

        .action-card {
            background: rgba(30, 41, 59, 0.6);
            border: 1px solid #334155;
            border-radius: 16px;
            padding: 18px 14px;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .action-card:active { transform: scale(0.96); border-color: #38bdf8; }

        .action-icon-wrapper {
            width: 36px; height: 36px;
            background: rgba(56, 189, 248, 0.1);
            border-radius: 10px;
            display: flex; align-items: center; justify-content: center;
            margin-bottom: 12px;
            border: 1px solid rgba(56, 189, 248, 0.2);
        }
        .action-icon-wrapper svg { width: 20px; height: 20px; fill: #38bdf8; }
        .action-title { font-size: 0.9rem; font-weight: 600; color: #e2e8f0; margin-bottom: 2px; }
        .action-desc { font-size: 0.75rem; color: #94a3b8; }

        /* --- TELA DE CHAT --- */
        .chat-header {
            padding: 16px;
            background: #1e293b;
            border-bottom: 1px solid #334155;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .chat-title { font-size: 1rem; font-weight: 700; color: #38bdf8; }
        
        .chat-messages {
            flex: 1;
            padding: 16px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .chat-message-item {
            background: rgba(30, 41, 59, 0.7);
            border: 1px solid #334155;
            border-radius: 12px;
            padding: 10px 12px;
            max-width: 85%;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .chat-msg-header {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .chat-msg-avatar {
            width: 26px;
            height: 26px;
            border-radius: 50%;
            background: #0f172a;
            overflow: hidden;
            border: 1px solid #38bdf8;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .chat-msg-avatar img { width: 100%; height: 100%; object-fit: cover; }
        .chat-msg-avatar svg { width: 14px; height: 14px; fill: #64748b; }

        .chat-msg-userinfo {
            display: flex;
            flex-direction: column;
        }

        .chat-msg-name { font-size: 0.8rem; font-weight: bold; color: #f8fafc; }
        .chat-msg-id { font-size: 0.65rem; color: #38bdf8; }

        .chat-msg-text {
            font-size: 0.85rem;
            color: #cbd5e1;
            word-break: break-word;
            margin-top: 4px;
            padding-left: 34px;
        }

        .chat-input-bar {
            padding: 12px;
            background: #1e293b;
            border-top: 1px solid #334155;
            display: flex;
            gap: 8px;
        }

        /* --- TELA DE PERFIL --- */
        .profile-edit-body {
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        .input-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .input-group label {
            font-size: 0.8rem;
            color: #94a3b8;
            font-weight: 600;
        }

        /* --- MODAIS COMUNS --- */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(5, 8, 15, 0.85);
            backdrop-filter: blur(8px);
            z-index: 2000;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 16px;
        }
        .modal-overlay.active { display: flex; }
        .modal-content {
            background: #1e293b;
            border: 1px solid #38bdf8;
            border-radius: 16px;
            width: 100%;
            max-width: 450px;
            max-height: 85vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
        }
        .modal-header {
            padding: 16px;
            background: #0f172a;
            border-bottom: 1px solid #334155;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .modal-title { font-size: 1rem; font-weight: 600; color: #38bdf8; }
        .modal-close { background: none; border: none; color: #94a3b8; font-size: 1.2rem; cursor: pointer; }
        .modal-body {
            padding: 16px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
            font-size: 0.85rem;
            color: #cbd5e1;
        }

        .custom-input {
            width: 100%;
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 8px;
            padding: 10px 12px;
            color: #f8fafc;
            font-size: 0.9rem;
            outline: none;
        }
        .custom-input:focus { border-color: #38bdf8; }

        .custom-btn {
            background: #0284c7;
            color: #fff;
            border: none;
            border-radius: 8px;
            padding: 10px 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }
        .custom-btn:active { background: #0369a1; }

        .hidden-input { display: none; }
        .info-row {
            display: flex; justify-content: space-between; padding: 10px 12px;
            background: rgba(15, 23, 42, 0.6); border-radius: 8px; border: 1px solid #334155;
        }
        .info-label { color: #94a3b8; font-weight: 500; }
        .info-value { color: #38bdf8; font-weight: 600; text-align: right; }
        #mapa-ip, #mapa-log-detalhe { width: 100%; height: 200px; border-radius: 10px; border: 1px solid #334155; z-index: 1; margin-top: 6px; }
    </style>
</head>
<body>

    <div class="app-container">

        <!-- ================= SECTION 1: HOME / PAINEL ================= -->
        <div id="section-home" class="view-section active">
            <div class="banner-container" id="banner-container" onclick="document.getElementById('banner-file-input').click()">
                <div class="banner-overlay"></div>
                <div class="banner-upload-btn" id="banner-upload-btn">
                    <svg viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
                </div>
                <input type="file" id="banner-file-input" class="hidden-input" accept="image/*,video/*" onchange="carregarBanner(event)">
            </div>

            <div class="content-body">
                <div class="profile-card">
                    <div class="profile-avatar-container">
                        <div class="profile-avatar" id="profile-avatar">
                            <svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
                        </div>
                        <div class="avatar-upload-overlay" onclick="document.getElementById('avatar-file-input').click()">
                            <svg viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
                        </div>
                        <input type="file" id="avatar-file-input" class="hidden-input" accept="image/*" onchange="carregarAvatar(event)">
                    </div>

                    <div class="profile-info">
                        <div class="name-wrapper">
                            <h2 id="user-name">DEFINIR NOME</h2>
                        </div>
                        <span id="user-tag-id" class="profile-tag-id">@seu_id</span>
                        <span class="profile-badge">ROLE: USER</span>
                    </div>
                </div>

                <div class="grid-2x2">
                    <div class="action-card" onclick="abrirBuscaIP()">
                        <div class="action-icon-wrapper">
                            <svg viewBox="0 0 24 24"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/></svg>
                        </div>
                        <div>
                            <div class="action-title">Busca de IP</div>
                            <div class="action-desc">Consultar IP de terceiros</div>
                        </div>
                    </div>

                    <div class="action-card" onclick="abrirCapturaRemota()">
                        <div class="action-icon-wrapper">
                            <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z"/></svg>
                        </div>
                        <div>
                            <div class="action-title">Captura Remota</div>
                            <div class="action-desc">Câmera, Áudio e Mapa</div>
                        </div>
                    </div>

                    <div class="action-card" onclick="abrirBuscaLink()">
                        <div class="action-icon-wrapper">
                            <svg viewBox="0 0 24 24"><path d="M3.9 12c0-1.71 1.39-3.1 3.1-3.1h4V7H7c-2.76 0-5 2.24-5 5s2.24 5 5 5h4v-1.9H7c-1.71 0-3.1-1.39-3.1-3.1zM8 13h8v-2H8v2zm9-6h-4v1.9h4c1.71 0 3.1 1.39 3.1 3.1s-1.39 3.1-3.1 3.1h-4V17h4c2.76 0 5-2.24 5-5s-2.24-5-5-5z"/></svg>
                        </div>
                        <div>
                            <div class="action-title">Busca via Link</div>
                            <div class="action-desc">Grabify Logs</div>
                        </div>
                    </div>

                    <div class="action-card" onclick="abrirBuscaPerfilPorId()">
                        <div class="action-icon-wrapper">
                            <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
                        </div>
                        <div>
                            <div class="action-title">Buscar Perfil</div>
                            <div class="action-desc">Encontrar por @ID</div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- ================= SECTION 2: CHAT ================= -->
        <div id="section-chat" class="view-section">
            <div class="chat-header">
                <span class="chat-title">Chat Global & Comunicação</span>
                <button class="custom-btn" style="padding: 4px 10px; font-size: 0.75rem;" onclick="abrirBuscaPerfilPorId()">Buscar Alvo por ID</button>
            </div>
            
            <div class="chat-messages" id="chat-messages-container">
                <div style="text-align: center; color: #64748b; font-size: 0.8rem; margin-top: 20px;">Carregando conversas do Firebase...</div>
            </div>

            <div class="chat-input-bar">
                <input type="text" id="chat-input-text" class="custom-input" placeholder="Digite sua mensagem..." onkeypress="if(event.key === 'Enter') enviarMensagemChat()">
                <button class="custom-btn" onclick="enviarMensagemChat()">Enviar</button>
            </div>
        </div>

        <!-- ================= SECTION 3: PERFIL ================= -->
        <div id="section-profile" class="view-section">
            <div class="chat-header">
                <span class="chat-title">Configurações de Perfil</span>
            </div>
            <div class="profile-edit-body">
                <div class="input-group">
                    <label>Seu Nome de Exibição:</label>
                    <input type="text" id="profile-edit-name" class="custom-input" placeholder="Seu nome">
                </div>
                <div class="input-group">
                    <label>Seu ID Único (Obrigatório começar com @):</label>
                    <input type="text" id="profile-edit-tag" class="custom-input" placeholder="@exemplo">
                </div>
                <div class="input-group">
                    <label>Sua Biografia:</label>
                    <textarea id="profile-edit-bio" class="custom-input" rows="3" placeholder="Escreva algo sobre você..."></textarea>
                </div>
                <button class="custom-btn" onclick="salvarPerfilUsuario()">Salvar Alterações</button>
            </div>
        </div>

        <!-- ================= DOCK NAVIGATION BAR ================= -->
        <nav class="cyber-dock">
            <button class="dock-item" id="dock-btn-chat" onclick="mudarAba('chat')">
                <svg viewBox="0 0 24 24"><path d="M20 2H4c-1.1 0-1.99.9-1.99 2L2 22l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zM6 9h12v2H6V9zm8 5H6v-2h8v2zm4-6H6V6h12v2z"/></svg>
                <span>CHATE</span>
            </button>

            <div class="dock-center-btn" onclick="mudarAba('home')">
                <svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
            </div>

            <button class="dock-item" id="dock-btn-profile" onclick="mudarAba('profile')">
                <svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
                <span>PERFIL</span>
            </button>
        </nav>

    </div>

    <!-- ================= MODAL GERAL ================= -->
    <div class="modal-overlay" id="app-modal" onclick="fecharModal(event)">
        <div class="modal-content" onclick="event.stopPropagation()">
            <div class="modal-header">
                <span class="modal-title" id="modal-title">Painel de Dados</span>
                <button class="modal-close" onclick="fecharModalDireto()">&times;</button>
            </div>
            <div class="modal-body" id="modal-body"></div>
        </div>
    </div>

    <!-- SCRIPT DO LEAFLET E LÓGICA DO PAINEL / FIREBASE -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <script>
        const FIREBASE_DB_URL = "https://linkapi1-zrx-default-rtdb.firebaseio.com";
        let mapaIP = null;
        let marcadorIP = null;
        let mapaDetalhe = null;
        let currentTargetId = localStorage.getItem('currentTargetId') || "alvo01";

        // Inicialização ao carregar a página
        window.onload = function() {
            verificarInstalacaoPerfil();
            carregarDadosInterface();
            escutarMensagensChat();
        };

        // Regra de Instalação: Se não tiver nome ou ID configurado, força o cadastro inicial
        function verificarInstalacaoPerfil() {
            let nome = localStorage.getItem('userName');
            let tagId = localStorage.getItem('userTagId');

            if (!nome || !tagId || !tagId.startsWith('@')) {
                abrirModalInstalacao();
            }
        }

        function abrirModalInstalacao() {
            const modal = document.getElementById('app-modal');
            document.getElementById('modal-title').textContent = "Configuração Inicial do Painel";
            modal.classList.add('active');

            document.getElementById('modal-body').innerHTML = `
                <div style="font-size: 0.85rem; color: #94a3b8; margin-bottom: 4px;">Bem-vindo! Para usar o chat e o painel, defina suas credenciais:</div>
                <div class="input-group">
                    <label>Seu Nome:</label>
                    <input type="text" id="setup-name" class="custom-input" placeholder="Ex: CyberUser">
                </div>
                <div class="input-group">
                    <label>Seu ID (Obrigatório começar com @):</label>
                    <input type="text" id="setup-tag" class="custom-input" placeholder="Ex: @usuario01" value="@">
                </div>
                <button class="custom-btn" style="margin-top: 8px;" onclick="salvarInstalacaoInicial()">Concluir Configuração</button>
            `;
        }

        function salvarInstalacaoInicial() {
            const nome = document.getElementById('setup-name').value.trim();
            let tagId = document.getElementById('setup-tag').value.trim();

            if (!nome) {
                alert("Por favor, digite um nome válido.");
                return;
            }
            if (!tagId.startsWith('@') || tagId.length < 2) {
                alert("O ID deve começar obrigatoriamente com o caractere @ (Ex: @hacker).");
                return;
            }

            localStorage.setItem('userName', nome);
            localStorage.setItem('userTagId', tagId);
            
            // Sincroniza o perfil no Firebase na pasta /perfis/{id_limpo}
            sincronizarPerfilFirebase(nome, tagId, "");

            fecharModalDireto();
            carregarDadosInterface();
            alert("Perfil configurado com sucesso!");
        }

        function carregarDadosInterface() {
            const savedName = localStorage.getItem('userName') || "DEFINIR NOME";
            const savedTag = localStorage.getItem('userTagId') || "@seu_id";
            
            document.getElementById('user-name').textContent = savedName;
            document.getElementById('user-tag-id').textContent = savedTag;
            
            document.getElementById('profile-edit-name').value = savedName === "DEFINIR NOME" ? "" : savedName;
            document.getElementById('profile-edit-tag').value = savedTag;
            document.getElementById('profile-edit-bio').value = localStorage.getItem('userBio') || "";

            const savedAvatar = localStorage.getItem('userAvatar');
            if (savedAvatar) aplicarAvatar(savedAvatar);

            const savedBanner = localStorage.getItem('userBanner');
            const savedBannerType = localStorage.getItem('userBannerType');
            if (savedBanner) aplicarBanner(savedBanner, savedBannerType === 'video');
        }

        // --- SISTEMA DE ABAS (DOCK) ---
        function mudarAba(aba) {
            document.querySelectorAll('.view-section').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.dock-item').forEach(el => el.classList.remove('active'));

            if (aba === 'home') {
                document.getElementById('section-home').classList.add('active');
            } else if (aba === 'chat') {
                document.getElementById('section-chat').classList.add('active');
                document.getElementById('dock-btn-chat').classList.add('active');
            } else if (aba === 'profile') {
                document.getElementById('section-profile').classList.add('active');
                document.getElementById('dock-btn-profile').classList.add('active');
            }
        }

        // --- SALVAR PERFIL ---
        async function salvarPerfilUsuario() {
            const novoNome = document.getElementById('profile-edit-name').value.trim();
            let novaTag = document.getElementById('profile-edit-tag').value.trim();
            const novaBio = document.getElementById('profile-edit-bio').value.trim();

            if (!novoNome || !novaTag) {
                alert("Preencha o nome e o ID.");
                return;
            }
            if (!novaTag.startsWith('@')) {
                alert("O ID precisa começar obrigatoriamente com @.");
                return;
            }

            localStorage.setItem('userName', novoNome);
            localStorage.setItem('userTagId', novaTag);
            localStorage.setItem('userBio', novaBio);

            await sincronizarPerfilFirebase(novoNome, novaTag, novaBio);

            carregarDadosInterface();
            alert("Perfil atualizado com sucesso!");
            mudarAba('home');
        }

        async function sincronizarPerfilFirebase(nome, tagId, bio) {
            try {
                let cleanKey = tagId.replace('@', '');
                let avatar = localStorage.getItem('userAvatar') || "";
                await fetch(`${FIREBASE_DB_URL}/perfis/${cleanKey}.json`, {
                    method: 'PUT',
                    body: JSON.stringify({ nome, tagId, bio, avatar, timestamp: Date.now() })
                });
            } catch (e) {
                console.error("Erro ao sincronizar perfil:", e);
            }
        }

        // --- BUSCAR PERFIL POR ID ---
        function abrirBuscaPerfilPorId() {
            const modal = document.getElementById('app-modal');
            document.getElementById('modal-title').textContent = "Buscar Perfil por @ID";
            modal.classList.add('active');

            document.getElementById('modal-body').innerHTML = `
                <div style="font-size: 0.8rem; color: #94a3b8;">Digite o ID do usuário (com ou sem @):</div>
                <div class="search-box-container">
                    <input type="text" id="search-id-input" class="custom-input" placeholder="@usuario">
                    <button class="custom-btn" onclick="executarBuscaPerfil()">Buscar</button>
                </div>
                <div id="perfil-search-result" style="margin-top: 8px;"></div>
            `;
        }

        async function executarBuscaPerfil() {
            let queryId = document.getElementById('search-id-input').value.trim().replace('@', '');
            const resultBox = document.getElementById('perfil-search-result');
            if (!queryId) return;

            resultBox.innerHTML = `<div style="text-align: center; color: #94a3b8; padding: 10px;">Buscando perfil...</div>`;

            try {
                let response = await fetch(`${FIREBASE_DB_URL}/perfis/${queryId}.json`);
                let perfil = await response.json();

                if (!perfil) {
                    resultBox.innerHTML = `<div style="color: #ef4444; text-align: center; padding: 10px;">Nenhum usuário encontrado com este ID.</div>`;
                    return;
                }

                resultBox.innerHTML = `
                    <div class="profile-card" style="margin-top: 4px;">
                        <div class="profile-avatar-container" style="width: 50px; height: 50px;">
                            <div class="profile-avatar">
                                ${perfil.avatar ? `<img src="${perfil.avatar}">` : `<svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>`}
                            </div>
                        </div>
                        <div class="profile-info">
                            <h2>${perfil.nome}</h2>
                            <span class="profile-tag-id">${perfil.tagId}</span>
                            <div style="font-size: 0.75rem; color: #94a3b8; margin-top: 4px;">${perfil.bio || 'Sem biografia.'}</div>
                        </div>
                    </div>
                `;
            } catch (e) {
                resultBox.innerHTML = `<div style="color: #ef4444; text-align: center; padding: 10px;">Erro ao consultar banco de dados.</div>`;
            }
        }

        // --- SISTEMA DE CHAT INTEGRADO AO FIREBASE ---
        async function enviarMensagemChat() {
            const input = document.getElementById('chat-input-text');
            const texto = input.value.trim();
            if (!texto) return;

            let nome = localStorage.getItem('userName') || "Anônimo";
            let tagId = localStorage.getItem('userTagId') || "@user";
            let avatar = localStorage.getItem('userAvatar') || "";

            let novaMsg = {
                nome: nome,
                tagId: tagId,
                avatar: avatar,
                texto: texto,
                timestamp: Date.now()
            };

            try {
                await fetch(`${FIREBASE_DB_URL}/chat_global.json`, {
                    method: 'POST',
                    body: JSON.stringify(novaMsg)
                });
                input.value = "";
            } catch (e) {
                alert("Erro ao enviar mensagem para o chat.");
            }
        }

        function escutarMensagensChat() {
            // Requisição periódica leve para atualizar o chat em tempo real sem servidor dedicado
            setInterval(atualizarMensagensChat, 3000);
            atualizarMensagensChat();
        }

        async function atualizarMensagensChat() {
            const container = document.getElementById('chat-messages-container');
            if (!container) return;

            try {
                let response = await fetch(`${FIREBASE_DB_URL}/chat_global.json`);
                let dados = await response.json();

                if (!dados) {
                    container.innerHTML = `<div style="text-align: center; color: #64748b; font-size: 0.8rem; margin-top: 20px;">Nenhuma mensagem no chat ainda. Seja o primeiro a falar!</div>`;
                    return;
                }

                let html = "";
                let chaves = Object.keys(dados);
                
                chaves.forEach(key => {
                    let msg = dados[key];
                    html += `
                        <div class="chat-message-item">
                            <div class="chat-msg-header">
                                <div class="chat-msg-avatar">
                                    ${msg.avatar ? `<img src="${msg.avatar}">` : `<svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>`}
                                </div>
                                <div class="chat-msg-userinfo">
                                    <span class="chat-msg-name">${msg.nome || 'Usuário'}</span>
                                    <span class="chat-msg-id">${msg.tagId || '@user'}</span>
                                </div>
                            </div>
                            <div class="chat-msg-text">${msg.texto}</div>
                        </div>
                    `;
                });

                container.innerHTML = html;
                container.scrollTop = container.scrollHeight;
            } catch (e) {
                console.error("Erro ao puxar chat:", e);
            }
        }

        // --- BANNER, AVATAR E FUNÇÕES AUXILIARES DO PAINEL ---
        function carregarBanner(event) {
            event.stopPropagation();
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                const fileURL = e.target.result;
                const isVideo = file.type.startsWith('video');
                localStorage.setItem('userBanner', fileURL);
                localStorage.setItem('userBannerType', isVideo ? 'video' : 'image');
                aplicarBanner(fileURL, isVideo);
            };
            reader.readAsDataURL(file);
        }

        function aplicarBanner(url, isVideo) {
            const bannerContainer = document.getElementById('banner-container');
            const uploadBtn = document.getElementById('banner-upload-btn');
            const oldMedia = bannerContainer.querySelector('img, video');
            if (oldMedia) oldMedia.remove();

            if (isVideo) {
                const video = document.createElement('video');
                video.src = url; video.autoplay = true; video.muted = true; video.loop = true; video.playsInline = true;
                bannerContainer.insertBefore(video, bannerContainer.firstChild);
            } else {
                const img = document.createElement('img');
                img.src = url;
                bannerContainer.insertBefore(img, bannerContainer.firstChild);
            }
            uploadBtn.classList.add('hidden');
        }

        function carregarAvatar(event) {
            event.stopPropagation();
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                const fileURL = e.target.result;
                localStorage.setItem('userAvatar', fileURL);
                aplicarAvatar(fileURL);
                // Sincroniza alteração do avatar no perfil do Firebase
                let nome = localStorage.getItem('userName');
                let tagId = localStorage.getItem('userTagId');
                let bio = localStorage.getItem('userBio') || "";
                if (tagId) sincronizarPerfilFirebase(nome, tagId, bio);
            };
            reader.readAsDataURL(file);
        }

        function aplicarAvatar(url) {
            document.getElementById('profile-avatar').innerHTML = `<img src="${url}" alt="Avatar">`;
        }

        function fecharModal(event) {
            if (event.target.id === 'app-modal') document.getElementById('app-modal').classList.remove('active');
        }

        function fecharModalDireto() {
            document.getElementById('app-modal').classList.remove('active');
        }

        function abrirBuscaIP() {
            const modal = document.getElementById('app-modal');
            document.getElementById('modal-title').textContent = "Consulta de IP (ipinfo.io)";
            modal.classList.add('active');

            document.getElementById('modal-body').innerHTML = `
                <div style="font-size: 0.8rem; color: #94a3b8;">Digite o endereço IP para consultar:</div>
                <div class="search-box-container" style="display: flex; gap: 8px;">
                    <input type="text" id="ip-input-target" class="custom-input" placeholder="Ex: 8.8.8.8">
                    <button class="custom-btn" onclick="consultarIPAlvo()">Buscar</button>
                </div>
                <div id="mapa-ip"></div>
                <div id="ip-result-container" style="display: flex; flex-direction: column; gap: 10px; margin-top: 4px;">
                    <div style="text-align: center; color: #64748b; padding: 10px;">Insira um IP acima para ver os dados.</div>
                </div>
            `;

            setTimeout(() => {
                if (mapaIP) mapaIP.remove();
                mapaIP = L.map('mapa-ip').setView([-14.235, -51.925], 4);
                L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19 }).addTo(mapaIP);
            }, 100);
        }

        async function consultarIPAlvo() {
            const ipInput = document.getElementById('ip-input-target').value.trim();
            const resultContainer = document.getElementById('ip-result-container');
            if (!ipInput) return;

            try {
                const response = await fetch(`https://ipinfo.io/${ipInput}/json`);
                const data = await response.json();
                if (data.loc) {
                    const [lat, lng] = data.loc.split(',').map(Number);
                    if (mapaIP) {
                        mapaIP.flyTo([lat, lng], 13);
                        if (marcadorIP) mapaIP.removeLayer(marcadorIP);
                        marcadorIP = L.marker([lat, lng]).addTo(mapaIP).bindPopup(`<b>${data.ip}</b>`).openPopup();
                    }
                }
                resultContainer.innerHTML = `
                    <div class="info-row"><span class="info-label">IP:</span><span class="info-value">${data.ip || 'N/A'}</span></div>
                    <div class="info-row"><span class="info-label">Cidade:</span><span class="info-value">${data.city || 'N/A'}</span></div>
                    <div class="info-row"><span class="info-label">Região:</span><span class="info-value">${data.region || 'N/A'}</span></div>
                    <div class="info-row"><span class="info-label">País:</span><span class="info-value">${data.country || 'N/A'}</span></div>
                    <div class="info-row"><span class="info-label">Provedor:</span><span class="info-value">${data.org || 'N/A'}</span></div>
                `;
            } catch (e) {
                resultContainer.innerHTML = `<div style="color: #ef4444; text-align: center;">Erro ao consultar IP.</div>`;
            }
        }

        async function abrirCapturaRemota() {
            const modal = document.getElementById('app-modal');
            document.getElementById('modal-title').textContent = `PAINEL DE CAPTURAS REMOTAS`;
            modal.classList.add('active');

            const linkGerado = `https://wv0304362-bot.github.io/linkApi1-/?id=${currentTargetId}`;

            document.getElementById('modal-body').innerHTML = `
                <div style="font-size: 0.8rem; color: #94a3b8;">Link com ID Atual (${currentTargetId}):</div>
                <div style="display: flex; gap: 8px;">
                    <input type="text" id="captura-link-input" class="custom-input" value="${linkGerado}" readonly>
                    <button class="custom-btn" onclick="navigator.clipboard.writeText(document.getElementById('captura-link-input').value); alert('Copiado!');">Copiar</button>
                </div>
                <div style="font-size: 0.8rem; color: #38bdf8; font-weight: bold; margin-top: 6px;">Registros Salvos:</div>
                <div id="lista-captura-container" style="max-height: 250px; overflow-y: auto;">Buscando...</div>
            `;

            try {
                let resposta = await fetch(`${FIREBASE_DB_URL}/capturas.json`);
                let todosDados = await resposta.json();
                const containerLista = document.getElementById('lista-captura-container');

                if (!todosDados || Object.keys(todosDados).length === 0) {
                    containerLista.innerHTML = `<div style="text-align: center; color: #64748b; padding: 10px;">Nenhum registro encontrado.</div>`;
                    return;
                }

                let itensHTML = "";
                for (let idKey in todosDados) {
                    let d = todosDados[idKey];
                    itensHTML += `
                        <div class="info-row" style="margin-bottom: 6px; align-items: center;">
                            <div>
                                <b style="color: #f8fafc;">${d.ip || 'IP'}</b><br>
                                <span style="font-size: 0.7rem; color: #94a3b8;">ID: ${idKey}</span>
                            </div>
                            <button class="custom-btn" style="padding: 4px 8px; font-size: 0.75rem;" onclick='verDetalhesFirebase(${JSON.stringify(d)}, "${idKey}")'>Ver</button>
                        </div>
                    `;
                }
                containerLista.innerHTML = itensHTML;
            } catch (e) {
                document.getElementById('lista-captura-container').innerHTML = `Erro ao carregar capturas.`;
            }
        }

        function verDetalhesFirebase(dados, idAlvo) {
            let lat = dados.location ? dados.location.lat : -14.235;
            let lon = dados.location ? dados.location.lon : -51.925;
            let foto = dados.media ? dados.media.photo : "";

            document.getElementById('modal-body').innerHTML = `
                <button class="custom-btn" style="background:#334155; margin-bottom:4px;" onclick="abrirCapturaRemota()">&larr; Voltar</button>
                <div class="info-row"><span class="info-label">IP:</span><span class="info-value">${dados.ip}</span></div>
                <div id="mapa-log-detalhe"></div>
                <div style="width: 100%; height: 180px; background: #0f172a; margin-top: 6px; border-radius: 8px; overflow: hidden; display: flex; align-items: center; justify-content: center;">
                    ${foto ? `<img src="${foto}" style="width:150px; height:150px; object-fit:cover;">` : `<span style="color:#64748b;">Sem foto</span>`}
                </div>
            `;

            setTimeout(() => {
                if (mapaDetalhe) mapaDetalhe.remove();
                mapaDetalhe = L.map('mapa-log-detalhe').setView([lat, lon], 14);
                L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(mapaDetalhe);
                L.marker([lat, lon]).addTo(mapaDetalhe);
            }, 100);
        }

        function abrirBuscaLink() {
            const modal = document.getElementById('app-modal');
            document.getElementById('modal-title').textContent = "Busca via Link";
            modal.classList.add('active');
            document.getElementById('modal-body').innerHTML = `
                <div style="font-size: 0.8rem; color: #94a3b8;">Link de Apoio:</div>
                <div style="display: flex; gap: 8px;">
                    <input type="text" id="private-input" class="custom-input" value="https://mymap.icu/YR9FVS.mp4" readonly>
                    <button class="custom-btn" onclick="navigator.clipboard.writeText(document.getElementById('private-input').value); alert('Copiado!');">Copiar</button>
                </div>
                <button class="custom-btn" style="margin-top: 8px;" onclick="window.open('https://grabify.link/track/D5MWM2', '_blank')">Abrir Grabify</button>
            `;
        }
    </script>
